<!doctype html>
<html lang="en">
<head>

<title>Tinsae logo — raster export sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Noto+Sans+Ethiopic:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif}
.sheet{display:flex;flex-direction:column;gap:28px;padding:28px;align-items:flex-start}

<body>
<div class="sheet">
<!-- Each block below is byte-identical in geometry to its .svg file, rendered with the real webfonts so the raster matches the vector exactly. -->

<div><div class="cap">tinsae-logo-orange · 242×120</div>
<svg class="ex" id="x-orange" width="242" height="120" viewBox="0 0 242 120"><rect width="242" height="120" rx="24" fill="#CC3000"/><g transform="translate(36 39) scale(0.65625)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 39 L22 49 L57 9"/><path d="M42 9 H57 V24"/></g><text x="94" y="60" fill="#FFFFFF" font-family="Plus Jakarta Sans" font-size="36" font-weight="800" letter-spacing="-1.26" dominant-baseline="central">Tinsae</text></svg></div>
