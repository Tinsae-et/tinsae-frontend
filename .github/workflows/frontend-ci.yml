name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Fails on known high/critical vulnerabilities in what ships to users.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Informational while the app is being built; switch to
      # `npm run placeholders -- --strict` before launch to block on leftovers.
      - name: List placeholders
        run: npm run placeholders
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
